apiVersion: orbixal.ai/v1
kind: agent

metadata:
  name: Orbixal Agent Hello World
  slug: orbixal_agent_hello_world
  version: 1.0.6
  description: Reads a JSON name and writes a JSON greeting.
  tags:
    - example
    - hello-world
    - job

spec:
  secrets:
    - name: HELLO_WORLD_API_KEY
      required: true
      description: Sample API key required by the hello-world agent.
    - name: HELLO_WORLD_SIGNING_KEY
      required: true
      description: Sample signing key required by the hello-world agent.
    - name: HELLO_WORLD_WEBHOOK_TOKEN
      required: false
      description: Optional token used when webhook delivery is configured.

  build:
    context: "."
    dockerfile: Dockerfile

  runtime:
    type: container
    supported_modes:
      - job
    default_mode: job
    job:
      execution:
        command:
          - python
          - /app/main.py
    timeouts:
      startupSeconds: 30
      requestSeconds: 60

  io:
    contract: json-v1
    input_schema:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    output_schema:
      type: object
      additionalProperties: false
      required:
        - greeting
      properties:
        greeting:
          type: string
    conformance_input:
      name: Orbixal
